<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>世界书管理</title>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="page-header">
      <div>
        <h1>📚 世界书管理</h1>
        <div id="meta-line" class="muted small">加载中…</div>
      </div>
      <div class="global-config card">
        <label>全局注入位置</label>
        <select id="global-position">
          <option value="user_input">用户消息末尾（缓存友好）</option>
          <option value="system_prompt">System Prompt 末尾</option>
        </select>
        <button id="save-global" class="btn">保存全局</button>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索名称 / 触发词…">
      <select id="filter-template">
        <option value="">全部模板</option>
        <option value="default">通用</option>
        <option value="common">常用</option>
        <option value="resident">常驻</option>
        <option value="chance">随机</option>
        <option value="schedule">日程</option>
        <option value="group">群聊</option>
        <option value="user">用户</option>
      </select>
      <select id="filter-enabled">
        <option value="">全部状态</option>
        <option value="on">仅启用</option>
        <option value="off">仅禁用</option>
      </select>
      <select id="filter-position">
        <option value="">全部注入位置</option>
        <option value="default">跟随全局</option>
        <option value="system_prompt">System Prompt</option>
        <option value="user_input">用户消息</option>
      </select>
      <span class="spacer"></span>
      <button id="btn-refresh" class="btn">刷新</button>
      <button id="btn-new" class="btn primary">＋ 新建条目</button>
    </div>

    <div id="entry-list" class="entry-list"></div>
  </div>

  <!-- 编辑弹窗 -->
  <div id="modal-mask" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">编辑条目</h2>
        <button id="modal-close" class="btn icon">✕</button>
      </div>
      <div class="modal-body">
        <section class="form-section">
          <h3>基础</h3>
          <div class="form-grid">
            <label>名称
              <input id="f-name" type="text" maxlength="20" placeholder="条目唯一名称">
            </label>
            <label>模板
              <select id="f-template">
                <option value="default">通用</option>
                <option value="common">常用</option>
                <option value="resident">常驻</option>
                <option value="chance">随机</option>
                <option value="schedule">日程</option>
                <option value="group">群聊</option>
                <option value="user">用户</option>
              </select>
            </label>
            <label>优先级（越小越先）
              <input id="f-priority" type="number" step="1">
            </label>
            <label class="check"><input id="f-enabled" type="checkbox"> 启用条目</label>
            <label>生效概率（0~1）
              <input id="f-probability" type="number" min="0" max="1" step="0.01">
            </label>
            <label>生效时长（秒，0=永久）
              <input id="f-duration" type="number" min="0" step="1">
            </label>
            <label>生效次数（0=不限）
              <input id="f-times" type="number" min="0" step="1">
            </label>
            <label>触发冷却（秒，0=不冷却）
              <input id="f-cooldown" type="number" min="0" step="60">
            </label>
          </div>
          <label>触发词 / 正则（每行一条）
            <textarea id="f-keywords" rows="3" placeholder="示例&#10;关键词&#10;^正则表达式$"></textarea>
          </label>
          <label>生效范围（每行一条：会话ID / 群号 / 用户ID / admin，留空=不限制）
            <textarea id="f-scope" rows="2"></textarea>
          </label>
          <label>注入位置
            <select id="f-position">
              <option value="default">跟随全局</option>
              <option value="user_input">用户消息末尾（缓存友好，推荐）</option>
              <option value="system_prompt">System Prompt 末尾</option>
            </select>
          </label>
          <label>注入内容
            <textarea id="f-content" rows="6" placeholder="条目生效时注入给模型的内容，支持 {user_name} {time} 等通配符"></textarea>
          </label>
          <div id="f-example" class="example-line"></div>
        </section>

        <section class="form-section">
          <h3>定时设置（可视化）</h3>
          <div class="form-grid">
            <label>定时模式
              <select id="f-mode">
                <option value="none">不定时</option>
                <option value="daily">每天</option>
                <option value="weekly">每周（按星期）</option>
                <option value="cron">自定义 cron（高级）</option>
              </select>
            </label>
          </div>

          <div id="mode-times" class="sub-panel hidden">
            <div class="panel-title">触发时刻</div>
            <div id="times-list" class="times-list"></div>
            <button id="btn-add-time" class="btn small">＋ 添加时刻</button>
          </div>

          <div id="mode-weekdays" class="sub-panel hidden">
            <div class="panel-title">生效星期</div>
            <div id="weekday-boxes" class="weekday-boxes"></div>
          </div>

          <div id="mode-cron" class="sub-panel hidden">
            <div class="panel-title">cron 表达式（分 时 日 月 周）</div>
            <input id="f-cron" type="text" placeholder="例：0 9 * * 1-5（周一至五 每天9点）">
          </div>

          <div class="form-grid">
            <label>起始日期（可选）
              <input id="f-start-date" type="date">
            </label>
            <label>结束日期（可选）
              <input id="f-end-date" type="date">
            </label>
          </div>
          <div class="sub-panel">
            <div class="panel-title">日期类型过滤</div>
            <div class="radio-row" id="day-filter-boxes">
              <label class="radio"><input type="radio" name="day_filter" value="all" checked> 全部日期</label>
              <label class="radio"><input type="radio" name="day_filter" value="workday"> 仅工作日</label>
              <label class="radio"><input type="radio" name="day_filter" value="holiday"> 仅节假日/周末</label>
            </div>
            <div id="holiday-hint" class="muted small"></div>
          </div>

          <div class="preview-box">
            <button id="btn-preview" class="btn">▶ 预览未来执行</button>
            <div id="schedule-describe" class="muted"></div>
            <ol id="preview-fires" class="preview-fires"></ol>
          </div>
        </section>
      </div>
      <div class="modal-footer">
        <span id="save-msg" class="muted"></span>
        <button id="btn-save" class="btn primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
